name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        go-version:
          - 1.25.x
          - 1.26.0-rc.1
        os:
          - ubuntu-slim
          - macos-26

    runs-on: ${{ matrix.os }}

    permissions:
      contents: "read"
      id-token: "write"

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Test
      run: go test -v -race -count=1 -shuffle=on -cover -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -tags='osusergo,netgo,static,testcgo' -ldflags='-s -w -buildid=' ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        slug: zchee/dumper
        use_oidc: true
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        disable_file_fixes: true
        verbose: true
